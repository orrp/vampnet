[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vampnet"
version = "0.0.1"
description = "Generative Music Modeling."
readme = "README.md"
authors = [
    { name = "Hugo Flores García", email = "hugggofloresgarcia@gmail.com" },
    { name = "Prem Seetharaman" }
]
license = { text = "MIT" }
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.7",
    "Topic :: Artistic Software",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.8"
dependencies = [
    "torch==2.4.1",
    "argbind>=0.3.2",
    "numpy==1.23",
    "wavebeat @ git+https://github.com/hugofloresgarcia/wavebeat",
    "lac @ git+https://github.com/hugofloresgarcia/lac.git",
    "descript-audiotools @ git+https://github.com/hugofloresgarcia/audiotools.git",
    "gradio",
    "loralib",
    "torch_pitch_shift",
    "plotly",
    "pydantic==2.10.6",
    "spaces",
    "python-osc",
    "boto3",
]

[project.urls]
Homepage = "https://github.com/hugofloresgarcia/vampnet"
Repository = "https://github.com/hugofloresgarcia/vampnet"

[tool.setuptools.packages.find]
where = ["."]
include = ["vampnet*"]
exclude = ["tests*"]
